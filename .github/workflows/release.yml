name: Release

# 三平台构建与发布：
#  - push tag 'v*'    -> 构建 + 发布 prerelease
#  - workflow_dispatch -> 干跑：只构建并上传 run artifacts，不发布
#
# 所有 action 固定到完整 commit SHA（版本号见各处注释）；允许清单与更新
# 流程见 docs/allowed-actions.md。所有外部下载（AppImage 工具、mpv-dev）
# 均固定版本化 tag 并校验 SHA256。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 构建 job 只需要读；写权限仅在 release job 内声明（最小化）。
permissions:
  contents: read

env:
  # zhongfly/mpv-winbuild 只有按日期滚动的 tag，无语义版本 tag。
  # 固定到 2026-11-04-ff8ca979b0；资产为 7z（README 里的 "zip" 说法与实际不符）。
  # 已核实（2026-11-07）：该资产存在且内容为
  #   include/mpv/{client,render,render_gl,stream_cb}.h + libmpv.dll.a + libmpv-2.dll
  MPV_WINBUILD_TAG: '2026-11-04-ff8ca979b0'
  MPV_DEV_ASSET: 'mpv-dev-x86_64-20261104-git-ff8ca979b0.7z'
  # 本地下载该资产算得的 SHA256（33,008,625 字节）
  MPV_DEV_ASSET_SHA256: '1779751d25bce85b41394caca37e6e7366a132124ccbe876b022e1f441cc804e'
  # linuxdeploy / linuxdeploy-plugin-qt：固定版本化 tag（continuous 分支内容
  # 会静默变更）。tag 与资产已核实存在（2026-11-07），SHA256 为本地下载
  # 该资产算得（尺寸与 release API 报告一致）。
  LINUXDEPLOY_VERSION: '1-alpha-20251107-1'
  LINUXDEPLOY_ASSET_SHA256: 'c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d'
  LINUXDEPLOY_PLUGIN_QT_VERSION: '1-alpha-20250213-1'
  LINUXDEPLOY_PLUGIN_QT_ASSET_SHA256: '15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724'

jobs:
  linux:
    name: Linux / Ubuntu 24.04 (AppImage)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (v4)

      # 与 ci.yml 完全一致的依赖集
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-declarative-dev qt6-wayland \
            libmpv-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-window qml6-module-qtquick-dialogs \
            qml6-module-qtquick-templates qml6-module-qtqml-workerscript \
            qml6-module-qt-labs-platform \
            xvfb libgl1-mesa-dri

      - name: Compute version string
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            # 干跑（分支 dispatch）：加短 SHA 避免与正式版混淆
            VER="${VER}-${GITHUB_SHA:0:7}"
          fi
          echo "Building version: $VER"
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure --timeout 120

      - name: Smoke test (QML boot under Xvfb + llvmpipe)
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 timeout 60 ./build/bin/emoplay --smoke-test

      - name: Download linuxdeploy tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deploy-tools"
          cd "$RUNNER_TEMP/deploy-tools"
          curl -fL --retry 3 -o linuxdeploy-x86_64.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_VERSION}/linuxdeploy-x86_64.AppImage"
          curl -fL --retry 3 -o linuxdeploy-plugin-qt-x86_64.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/${LINUXDEPLOY_PLUGIN_QT_VERSION}/linuxdeploy-plugin-qt-x86_64.AppImage"
          # 固定版本 + 校验和：资产被替换会在此处失败，而不是注入到产物里。
          echo "${LINUXDEPLOY_ASSET_SHA256}  linuxdeploy-x86_64.AppImage" | sha256sum -c -
          echo "${LINUXDEPLOY_PLUGIN_QT_ASSET_SHA256}  linuxdeploy-plugin-qt-x86_64.AppImage" | sha256sum -c -
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      # 组装 AppImage；连续两轮失败则降级为 tar.gz（含二进制与打包说明），
      # 避免在 CI 里无限重试。
      - name: Assemble AppImage (2 attempts, tar.gz fallback)
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p dist
          rm -f ./*.AppImage 2>/dev/null || true

          # linuxdeploy-plugin-qt 需要定位 qmake；Ubuntu 24.04 的 Qt 6.4 提供
          # /usr/bin/qmake6（或 /usr/lib/qt6/bin/qmake6）。
          export QMAKE="$(command -v qmake6 || echo /usr/lib/qt6/bin/qmake6)"
          # QML 全部编译进 qrc，必须显式告诉 plugin-qt 去源码目录扫描 import。
          export QML_SOURCES_PATHS="$PWD/qml"
          # runner 无 FUSE：主程序用 CLI 开关，插件 AppImage 靠该环境变量。
          export APPIMAGE_EXTRACT_AND_RUN=1
          export PATH="$RUNNER_TEMP/deploy-tools:$PATH"

          appimage_ok=""
          for attempt in 1 2; do
            echo "::group::linuxdeploy attempt $attempt"
            rm -rf AppDir
            "$RUNNER_TEMP/deploy-tools/linuxdeploy-x86_64.AppImage" --appimage-extract-and-run \
              --appdir "$PWD/AppDir" \
              -e "$PWD/build/bin/emoplay" \
              -d "$PWD/packaging/linux/emoplay.desktop" \
              -i "$PWD/packaging/linux/emoplay.png" \
              --plugin qt \
              --output appimage
            img="$(ls -t ./*.AppImage 2>/dev/null | head -1 || true)"
            echo "::endgroup::"
            if [ -n "$img" ]; then
              appimage_ok=1
              break
            fi
            echo "attempt $attempt produced no AppImage"
          done

          if [ -n "$appimage_ok" ]; then
            mv "$img" "dist/EmoPlay-${VER}-linux-x86_64.AppImage" \
              || { echo "::error::failed to move $img into dist/"; exit 1; }
            echo "Packaged: dist/EmoPlay-${VER}-linux-x86_64.AppImage"
          else
            echo "::warning::AppImage assembly failed twice; falling back to tar.gz"
            # staging 建在 dist/ 之外：dist/ 里只允许出现最终产物，避免中间
            # 目录树混进 artifact / release。
            stage="linux-fallback-stage/emoplay-${VER}-linux-x86_64"
            rm -rf linux-fallback-stage
            mkdir -p "$stage/bin"
            cp build/bin/emoplay "$stage/bin/" \
              || { echo "::error::fallback staging failed (copy binary)"; exit 1; }
            cp packaging/linux/emoplay.desktop "$stage/" \
              || { echo "::error::fallback staging failed (copy desktop)"; exit 1; }
            cp packaging/linux/RUNNING.txt "$stage/" \
              || { echo "::error::fallback staging failed (copy RUNNING.txt)"; exit 1; }
            tar -czf "dist/EmoPlay-${VER}-linux-x86_64.tar.gz" \
              -C linux-fallback-stage "emoplay-${VER}-linux-x86_64" \
              || { echo "::error::fallback tar.gz creation failed"; exit 1; }
            rm -rf linux-fallback-stage
            echo "Packaged: dist/EmoPlay-${VER}-linux-x86_64.tar.gz"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (v4)
        with:
          name: dist-linux
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows / MSVC (Qt 6.4.3, zhongfly libmpv)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (v4)

      - name: Install Qt 6.4.3 (win64_msvc2019_64)
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0 (v4)
        with:
          version: '6.4.3'
          arch: 'win64_msvc2019_64'

      # windows-latest 现为 VS 18（MSVC 14.51），其 STL 已删除
      # stdext::checked_array_iterator 系列；Qt 6.4.3 的
      # qcompilerdetection.h 无条件把 QT_MAKE_CHECKED/UNCHECKED_ARRAY_ITERATOR
      # 映射到 stdext 工厂函数（qvarlengtharray.h 因此编译失败 C3861/C2065）。
      # Qt 6.6 对 _MSC_VER >= 1938 的官方做法就是退化为恒等宏（裸迭代器），
      # 这里对 CI 安装的 Qt 6.4.3 做同样的两处替换。
      - name: Patch Qt 6.4.3 for current MSVC STL (stdext removed)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $h = Join-Path $env:QT_ROOT_DIR 'include\QtCore\qcompilerdetection.h'
          $c = [System.IO.File]::ReadAllText($h)
          $c = $c.Replace(
            'stdext::make_unchecked_array_iterator(x) // Since _MSC_VER >= 1800',
            '(x) // stdext removed from current MSVC STL; identity, as Qt >= 6.6 does for _MSC_VER >= 1938')
          $c = $c.Replace(
            'stdext::make_checked_array_iterator(x, size_t(N)) // Since _MSC_VER >= 1500',
            '(x) // stdext removed from current MSVC STL; identity, as Qt >= 6.6 does for _MSC_VER >= 1938')
          [System.IO.File]::WriteAllText($h, $c)
          if (Select-String -Path $h -Pattern 'stdext::' -Quiet) {
            throw "qcompilerdetection.h patch failed: stdext:: still referenced"
          }
          Write-Host "Patched OK: $h"

      # CMakeLists.txt 走 pkg_check_modules(mpv)，Windows runner 无 pkg-config，
      # 装 pkgconfiglite（Chocolatey 社区源已核实存在；固定 0.28.0，
      # run 42268937918 日志确认安装的即为该版本）。
      - name: Install pkg-config
        run: choco install pkgconfiglite -y --no-progress --version 0.28.0

      - name: Compute version string
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          if (-not $env:GITHUB_REF.StartsWith('refs/tags/')) {
            $ver = "$ver-$($env:GITHUB_SHA.Substring(0, 7))"
          }
          Write-Host "Building version: $ver"
          Add-Content -Path $env:GITHUB_ENV -Value "VER=$ver"

      - name: Download libmpv (zhongfly/mpv-winbuild, pinned release)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/zhongfly/mpv-winbuild/releases/download/$env:MPV_WINBUILD_TAG/$env:MPV_DEV_ASSET"
          Invoke-WebRequest -Uri $url -OutFile mpv-dev.7z
          # 固定版本 + 校验和
          $hash = (Get-FileHash mpv-dev.7z -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:MPV_DEV_ASSET_SHA256) {
            throw "mpv-dev.7z SHA256 mismatch: got $hash, expected $env:MPV_DEV_ASSET_SHA256"
          }
          Write-Host "mpv-dev.7z SHA256 OK: $hash"
          # runner 镜像自带 7-Zip（runner-images 文档核实：7zip 26.05）
          7z x -y -ompv-dev mpv-dev.7z | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z extraction failed" }
          Get-ChildItem -Recurse mpv-dev | Select-Object -ExpandProperty FullName

      # 归档根目录平铺：include/mpv/*.h、libmpv.dll.a（GNU 导入库，COFF 格式，
      # MSVC 可直接链接）、libmpv-2.dll。整理成 CMake/pkg-config 可用的 prefix：
      # 复制为 mpv.lib 以便 MSVC 的 find_library 按 .lib 后缀解析 -lmpv。
      - name: Stage libmpv SDK prefix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = Join-Path (Get-Location) 'mpv-sdk'
          New-Item -ItemType Directory -Force -Path "$prefix/include", "$prefix/lib/pkgconfig", "$prefix/bin" | Out-Null
          Copy-Item -Recurse -Force mpv-dev/include/mpv "$prefix/include/"
          Copy-Item -Force mpv-dev/libmpv.dll.a "$prefix/lib/mpv.lib"
          Copy-Item -Force mpv-dev/libmpv.dll.a "$prefix/lib/libmpv.dll.a"
          Copy-Item -Force mpv-dev/libmpv-2.dll "$prefix/bin/libmpv-2.dll"
          $prefixFwd = $prefix -replace '\\', '/'
          $pc = @"
          prefix=$prefixFwd
          libdir=`${prefix}/lib
          includedir=`${prefix}/include

          Name: mpv
          Description: libmpv client API (pinned zhongfly/mpv-winbuild build for CI)
          Version: 0.40.0-unofficial
          Libs: -L`${libdir} -lmpv
          Cflags: -I`${includedir}
          "@
          Set-Content -Path "$prefix/lib/pkgconfig/mpv.pc" -Value $pc -Encoding ascii
          Add-Content -Path $env:GITHUB_ENV -Value "MPV_SDK=$prefix"
          Add-Content -Path $env:GITHUB_ENV -Value "PKG_CONFIG_PATH=$prefix\lib\pkgconfig;$env:PKG_CONFIG_PATH"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0 (v1)

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: cmake --build build

      - name: Package (windeployqt + libmpv-2.dll, then zip)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $deploy = "dist/EmoPlay-$env:VER-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $deploy | Out-Null
          Copy-Item build/bin/emoplay.exe $deploy/
          windeployqt --release --qmldir qml "$deploy/emoplay.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
          Copy-Item mpv-dev/libmpv-2.dll $deploy/
          7z a -y -tzip "dist/EmoPlay-$env:VER-windows-x86_64.zip" "$deploy" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "zip packaging failed" }
          Get-ChildItem dist

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (v4)
        with:
          name: dist-windows
          path: dist/*.zip
          if-no-files-found: error

  macos:
    # macos-14 已于 2026-11-02 从 GitHub Actions 退役（runner-images #15226），
    # macos-13 更早退役；macos-15 为 arm64。Qt 6.4.3 的 macOS 包是 universal
    # （x86_64/arm64，见 qtsdkrepository Updates.xml），在 arm64 上可用。
    name: macOS 15 / arm64 (Qt 6.4.3 universal, brew libmpv)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (v4)

      # Homebrew 的 mpv formula 以 -Dlibmpv=true 构建，安装
      # include/mpv/*.h 与 lib/pkgconfig/mpv.pc（formula 源码已核实）。
      # brew 的 mpv 随上游滚动，不做版本 pin（pin 需自建 formula，成本高），
      # 但必须把安装到的确切版本记录进构建日志，便于追溯 ABI 漂移；
      # 若 client API 与源码不兼容，Configure 步骤会以 pkg-config 错误显式失败。
      - name: Install dependencies (brew)
        run: |
          set -euo pipefail
          brew install mpv pkg-config ninja
          mpv_ver="$(pkg-config --modversion mpv)"
          echo "brew libmpv version: ${mpv_ver}"
          echo "::notice::brew libmpv version: ${mpv_ver}"
          echo "BREW_MPV_VERSION=${mpv_ver}" >> "$GITHUB_ENV"

      - name: Install Qt 6.4.3 (clang_64, universal x86_64/arm64)
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0 (v4)
        with:
          version: '6.4.3'
          arch: 'clang_64'

      - name: Compute version string
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            VER="${VER}-${GITHUB_SHA:0:7}"
          fi
          echo "Building version: $VER"
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          set -euo pipefail
          # install-qt-action 会把 Qt 的 pkgconfig 目录放进 PKG_CONFIG_PATH；
          # 显式补上 Homebrew 的目录，保证 pkg-config 能找到 mpv.pc。
          export PKG_CONFIG_PATH="/opt/homebrew/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Package (macdeployqt + ad-hoc codesign + dmg)
        run: |
          set -euo pipefail
          mkdir -p dist staging
          # CMake 的 bundle 目录名跟随 target（emoplay.app），发布时改成
          # EmoPlay.app 再交给 macdeployqt。
          cp -R build/bin/emoplay.app staging/EmoPlay.app
          ln -s /Applications staging/Applications
          macdeployqt staging/EmoPlay.app -qmldir="$PWD/qml"
          codesign --force --deep -s - staging/EmoPlay.app
          # dmg 根目录放 EmoPlay.app 与 /Applications 软链，拖动即装。
          hdiutil create -volname "EmoPlay" -srcfolder staging \
            -ov -format UDZO "dist/EmoPlay-${VER}-macos.dmg"
          rm -rf staging
          ls -la dist

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (v4)
        with:
          name: dist-macos
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    # 干跑（workflow_dispatch）到此为止：只有 tag push 才发布。
    if: startsWith(github.ref, 'refs/tags/v')
    # 写权限只授予本 job（workflow 顶层是 contents: read）。
    permissions:
      contents: write
    steps:
      - name: Collect platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0 (v4)
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Show files to publish
        run: ls -la dist

      - name: Create prerelease with artifacts
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2 (v2)
        with:
          files: dist/*
          # 零文件匹配时使发布失败，而不是静默产出没有资产的空 Release
          # （action-gh-release 对目录/零匹配默认只告警）。
          fail_on_unmatched_files: true
          prerelease: true
          generate_release_notes: true
          body: |
            > **验证范围说明**
            >
            > - **Linux**：在 GitHub Actions 内完成编译、单元测试与 Xvfb QML 冒烟测试。
            > - **Windows / macOS**：为 CI 自动构建产物，未在实体机器上验证，属 experimental。
            > - **macOS** 包未做代码签名（仅 ad-hoc），首次打开会触发 Gatekeeper 提示：
            >   右键 App → 「打开」，或执行 `xattr -dr com.apple.quarantine /Applications/EmoPlay.app`。
            > - 若 Linux 资产为 tar.gz 而非 AppImage，说明 AppImage 组装在 CI 中连续两轮失败，
            >   已按预案降级；安装说明见压缩包内 RUNNING.txt。
